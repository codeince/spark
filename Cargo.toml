[package]
name = "spark"
description = "Flamee on Rust with extra features"
authors = ["Code Slasher Incorporation"]
version = "0.1.3"
edition = "2024"
license-file = "LICENSE"
readme = "README.md"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[package.metadata.winres]
ProductName = "Spark"
LegalCopyright = "Code Slasher Incorporation"
FileDescription = "This is your AI text adventure generator"

[dependencies]
r18 = "0.5"
rkyv = "0.8"
rand = "0.10"
termimad = "0.35"
regex = "1.13"
color-eyre = "0.6"
serde_json = "1.0"
llm = { version = "1.3", features = ["full"] }
clap = { version = "4.6", features = ["derive"] }
tokio = { version = "1.53", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
