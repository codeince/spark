[package]
name = "spark"
description = "Flamee on Rust with extra features"
version = "0.1.9"
edition = "2024"
license-file = "LICENSE"
readme = "README.md"

[package.metadata.winres]
ProductName = "Spark"
LegalCopyright = "Code Slasher Incorporation"
FileDescription = "This is your AI text adventure generator"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
color-eyre = "0.6"
llm = { version = "1.3", features = ["full"] }
r18 = "0.5"
rand = "0.10"
regex = "1.13"
rkyv = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
termimad = "0.35"
tokio = { version = "1.53", features = ["full"] }
